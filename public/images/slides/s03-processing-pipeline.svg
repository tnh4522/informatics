<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="pipeBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pipeBg)"/>

  <!-- Header Plate -->
  <rect x="210" y="24" width="380" height="34" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="45" text-anchor="middle" fill="#93C5FD" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700">HÌNH 1.1 · QUÁ TRÌNH XỬ LÍ THÔNG TIN TRONG MÁY TÍNH</text>

  <!-- Stage 1: INPUT (Thu nhan) -->
  <g transform="translate(50, 102)">
    <rect width="196" height="246" rx="6" fill="#1C2431" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="196" height="42" rx="6" fill="url(#step1)"/>
    <text x="98" y="26" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">1. THU NHẬN</text>
    <!-- Input Sensors Illustration -->
    <g transform="translate(26, 66)">
      <!-- Eye / Camera Lens -->
      <circle cx="38" cy="36" r="24" fill="#141A23" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="38" cy="36" r="11" fill="#2563EB"/>
      <circle cx="42" cy="32" r="4" fill="#DBEAFE"/>
      <!-- Keyboard block -->
      <rect x="82" y="14" width="64" height="42" rx="4" fill="#141A23" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="90" y="22" width="12" height="8" rx="1" fill="#93C5FD"/>
      <rect x="106" y="22" width="12" height="8" rx="1" fill="#93C5FD"/>
      <rect x="122" y="22" width="16" height="8" rx="1" fill="#93C5FD"/>
      <rect x="94" y="36" width="40" height="10" rx="1" fill="#3B82F6"/>
    </g>
    <rect x="20" y="156" width="156" height="68" rx="4" fill="#141A23" stroke="#2C384B"/>
    <text x="98" y="178" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="600">Dữ liệu vào (Input)</text>
    <text x="98" y="198" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">Số · Chữ · Âm · Ảnh</text>
    <text x="98" y="214" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11">Chuyển về dãy bit 0/1</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(254, 210)">
    <path d="M0 15 H46" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 5 L50 15 L36 25" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 2: PROCESS (Xu li) -->
  <g transform="translate(308, 92)">
    <rect width="196" height="266" rx="6" fill="#1C2431" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="196" height="44" rx="6" fill="url(#step2)"/>
    <text x="98" y="27" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">2. XỬ LÍ</text>
    <!-- Glowing CPU & Memory Core -->
    <g transform="translate(46, 68)">
      <rect x="14" y="10" width="76" height="76" rx="6" fill="#141A23" stroke="#FBBF24" stroke-width="2"/>
      <rect x="28" y="24" width="48" height="48" rx="4" fill="#B45309" opacity="0.35" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="52" y="53" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">CPU</text>
      <!-- Circuit lines -->
      <line x1="0" y1="30" x2="14" y2="30" stroke="#FBBF24" stroke-width="2.5"/>
      <line x1="0" y1="64" x2="14" y2="64" stroke="#FBBF24" stroke-width="2.5"/>
      <line x1="90" y1="30" x2="104" y2="30" stroke="#FBBF24" stroke-width="2.5"/>
      <line x1="90" y1="64" x2="104" y2="64" stroke="#FBBF24" stroke-width="2.5"/>
    </g>
    <rect x="20" y="172" width="156" height="72" rx="4" fill="#141A23" stroke="#2C384B"/>
    <text x="98" y="194" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="600">Biến đổi &amp; Tính toán</text>
    <text x="98" y="213" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11">RAM · Bộ xử lí số</text>
    <text x="98" y="230" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11">Lưu trữ trong bộ nhớ</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(510, 210)">
    <path d="M0 15 H46" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 5 L50 15 L36 25" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 3: OUTPUT (Xuat) -->
  <g transform="translate(562, 102)">
    <rect width="190" height="246" rx="6" fill="#1C2431" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="42" rx="6" fill="url(#step3)"/>
    <text x="95" y="26" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">3. XUẤT RA</text>
    <!-- Output Monitor Illustration -->
    <g transform="translate(32, 62)">
      <rect x="8" y="6" width="110" height="68" rx="4" fill="#141A23" stroke="#34D399" stroke-width="2"/>
      <rect x="20" y="42" width="16" height="22" rx="1" fill="#10B981"/>
      <rect x="42" y="28" width="16" height="36" rx="1" fill="#34D399"/>
      <rect x="64" y="20" width="16" height="44" rx="1" fill="#3B82F6"/>
      <circle cx="98" cy="30" r="10" fill="#FBBF24"/>
      <path d="M48 74 H78 L84 82 H42 Z" fill="#334155"/>
    </g>
    <rect x="18" y="156" width="154" height="68" rx="4" fill="#141A23" stroke="#2C384B"/>
    <text x="95" y="178" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="600">Thông tin (Output)</text>
    <text x="95" y="198" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="11">Màn hình · Loa · In ấn</text>
    <text x="95" y="214" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11">Phục vụ ra quyết định</text>
  </g>

  <!-- Feedback Loop Bottom Line -->
  <path d="M656 356 V392 H148 V356" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="275" y="378" width="250" height="26" rx="4" fill="#141A23" stroke="#334155"/>
  <text x="400" y="395" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="600">Dữ liệu đầu ra có thể tiếp tục làm dữ liệu đầu vào</text>
</svg>
