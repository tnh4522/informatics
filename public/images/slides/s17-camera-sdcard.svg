<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="camBg" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#camBg)"/>

  <!-- Header -->
  <rect x="155" y="18" width="490" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="38" text-anchor="middle" fill="#93C5FD" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="700">HÌNH 1.3 · BỐN ẢNH MẪU (TB 545,5 KB) &amp; THẺ NHỚ 16 GB</text>

  <!-- Left: Camera + SD Card 16 GB -->
  <g transform="translate(46, 78)">
    <rect width="268" height="332" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <!-- Mirrorless Digital Camera -->
    <g transform="translate(34, 24)">
      <rect x="34" y="6" width="52" height="14" rx="2" fill="#334155"/>
      <rect x="10" y="18" width="180" height="104" rx="8" fill="#0F141C" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="104" cy="70" r="36" fill="#141A23" stroke="#93C5FD" stroke-width="3"/>
      <circle cx="104" cy="70" r="22" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="96" cy="62" r="7" fill="#DBEAFE" opacity="0.7"/>
      <rect x="24" y="32" width="24" height="12" rx="2" fill="#FBBF24"/>
    </g>
    <!-- SD Memory Card 16 GB -->
    <g transform="translate(56, 174)">
      <path d="M0 14 L18 0 H152 V128 H0 Z" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
      <!-- Gold contacts -->
      <g fill="#FBBF24">
        <rect x="24" y="6" width="12" height="22" rx="1"/><rect x="42" y="6" width="12" height="22" rx="1"/>
        <rect x="60" y="6" width="12" height="22" rx="1"/><rect x="78" y="6" width="12" height="22" rx="1"/>
        <rect x="96" y="6" width="12" height="22" rx="1"/><rect x="114" y="6" width="12" height="22" rx="1"/>
      </g>
      <rect x="18" y="42" width="116" height="68" rx="4" fill="#141A23"/>
      <text x="76" y="72" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">16 GB</text>
      <text x="76" y="94" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11">16.777.216 KB</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M322 244 H352" stroke="#60A5FA" stroke-width="3"/>

  <!-- Right Grid: 4 Landscape Photos + Formula -->
  <g transform="translate(358, 78)">
    <!-- Photo 1: 438 KB -->
    <g transform="translate(0, 0)">
      <rect width="188" height="122" rx="4" fill="#1C2431" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="10" y="10" width="168" height="76" rx="2" fill="#0F172A"/>
      <path d="M10 86 L58 38 L94 72 L134 32 L178 86 Z" fill="#1D4ED8"/>
      <circle cx="40" cy="30" r="9" fill="#FBBF24"/>
      <text x="94" y="108" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Ảnh 1 · 438 KB</text>
    </g>

    <!-- Photo 2: 585 KB -->
    <g transform="translate(204, 0)">
      <rect width="188" height="122" rx="4" fill="#1C2431" stroke="#10B981" stroke-width="1.5"/>
      <rect x="10" y="10" width="168" height="76" rx="2" fill="#064E3B"/>
      <path d="M10 86 L64 46 L112 76 L150 40 L178 86 Z" fill="#10B981"/>
      <circle cx="144" cy="28" r="9" fill="#FDE68A"/>
      <text x="94" y="108" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Ảnh 2 · 585 KB</text>
    </g>

    <!-- Photo 3: 418 KB -->
    <g transform="translate(0, 136)">
      <rect width="188" height="122" rx="4" fill="#1C2431" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="10" y="10" width="168" height="76" rx="2" fill="#451A03"/>
      <path d="M10 86 L46 54 L96 74 L142 42 L178 86 Z" fill="#D97706"/>
      <circle cx="94" cy="34" r="10" fill="#FEF3C7"/>
      <text x="94" y="108" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Ảnh 3 · 418 KB</text>
    </g>

    <!-- Photo 4: 741 KB -->
    <g transform="translate(204, 136)">
      <rect width="188" height="122" rx="4" fill="#1C2431" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="10" y="10" width="168" height="76" rx="2" fill="#172554"/>
      <path d="M10 86 L54 44 L98 68 L138 28 L178 86 Z" fill="#3B82F6"/>
      <circle cx="52" cy="28" r="8" fill="#FAF8F3"/>
      <text x="94" y="108" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Ảnh 4 · 741 KB</text>
    </g>

    <!-- Bottom Capacity Summary -->
    <rect x="0" y="274" width="392" height="58" rx="4" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
    <text x="196" y="298" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">TB = (438 + 585 + 418 + 741) / 4 = 545,5 KB</text>
    <text x="196" y="319" text-anchor="middle" fill="#BBF7D0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">16.777.216 / 545,5 ≈ 30.755 bức ảnh</text>
  </g>
</svg>
