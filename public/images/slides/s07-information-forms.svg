<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="formsBg" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#formsBg)"/>

  <!-- Four Quadrants connecting to Center Binary Core -->
  <!-- Orbit Ring -->
  <circle cx="400" cy="225" r="142" stroke="#2C384B" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Center Node: Du lieu so & Toan ven -->
  <circle cx="400" cy="225" r="76" fill="#172554" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="400" cy="225" r="58" fill="#141A23" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="400" y="214" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">DỮ LIỆU</text>
  <text x="400" y="233" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">01001101</text>
  <text x="400" y="250" text-anchor="middle" fill="#86EFAC" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Toàn vẹn ngữ cảnh</text>

  <!-- Node 1 Top Left: Van ban & So -->
  <g transform="translate(86, 62)">
    <rect width="208" height="114" rx="6" fill="#1C2431" stroke="#3B82F6" stroke-width="2"/>
    <rect x="16" y="22" width="44" height="54" rx="3" fill="#FAF8F3"/>
    <line x1="24" y1="36" x2="52" y2="36" stroke="#1D4ED8" stroke-width="2.5"/>
    <line x1="24" y1="48" x2="50" y2="48" stroke="#64748B" stroke-width="2"/>
    <line x1="24" y1="59" x2="44" y2="59" stroke="#64748B" stroke-width="2"/>
    <text x="74" y="42" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Văn bản &amp; Số</text>
    <text x="74" y="62" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Kí tự, bảng biểu, số liệu</text>
    <text x="74" y="80" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">.txt .docx .pdf</text>
  </g>
  <line x1="294" y1="138" x2="340" y2="176" stroke="#3B82F6" stroke-width="2"/>

  <!-- Node 2 Top Right: Hinh anh -->
  <g transform="translate(506, 62)">
    <rect width="208" height="114" rx="6" fill="#1C2431" stroke="#10B981" stroke-width="2"/>
    <rect x="16" y="22" width="54" height="54" rx="4" fill="#141A23" stroke="#34D399" stroke-width="1.5"/>
    <path d="M22 68 L36 46 L48 60 L56 50 L65 68 Z" fill="#10B981"/>
    <circle cx="56" cy="36" r="5" fill="#FBBF24"/>
    <text x="82" y="42" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Hình ảnh</text>
    <text x="82" y="62" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Bản vẽ, ảnh chụp số</text>
    <text x="82" y="80" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="11">.jpg .png .svg</text>
  </g>
  <line x1="506" y1="138" x2="460" y2="176" stroke="#10B981" stroke-width="2"/>

  <!-- Node 3 Bottom Left: Am thanh -->
  <g transform="translate(86, 274)">
    <rect width="208" height="114" rx="6" fill="#1C2431" stroke="#F59E0B" stroke-width="2"/>
    <g transform="translate(18, 28)">
      <rect x="0" y="18" width="8" height="20" rx="2" fill="#FBBF24"/>
      <rect x="12" y="8" width="8" height="40" rx="2" fill="#F59E0B"/>
      <rect x="24" y="0" width="8" height="54" rx="2" fill="#FBBF24"/>
      <rect x="36" y="14" width="8" height="28" rx="2" fill="#F59E0B"/>
    </g>
    <text x="74" y="42" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Âm thanh</text>
    <text x="74" y="62" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Giọng nói, sóng âm số</text>
    <text x="74" y="80" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11">.mp3 .wav</text>
  </g>
  <line x1="294" y1="312" x2="340" y2="274" stroke="#F59E0B" stroke-width="2"/>

  <!-- Node 4 Bottom Right: Ngu canh & Mang tin -->
  <g transform="translate(506, 274)">
    <rect width="208" height="114" rx="6" fill="#1C2431" stroke="#60A5FA" stroke-width="2"/>
    <path d="M40 22 L62 32 V48 C62 63 52 72 40 78 C28 72 18 63 18 48 V32 Z" fill="#1D4ED8" opacity="0.35" stroke="#60A5FA" stroke-width="2"/>
    <path d="M32 49 L38 55 L50 41" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="42" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Ngữ cảnh chuẩn</text>
    <text x="78" y="62" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Đủ nhãn cột, không mất</text>
    <text x="78" y="80" fill="#BFDBFE" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">bảo đảm tính toàn vẹn</text>
  </g>
  <line x1="506" y1="312" x2="460" y2="274" stroke="#60A5FA" stroke-width="2"/>
</svg>
