<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="cccdBg" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cccdBg)"/>

  <!-- Header -->
  <rect x="170" y="22" width="460" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="42" text-anchor="middle" fill="#FDE68A" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="700">VẬN DỤNG 1 · CĂN CƯỚC CÔNG DÂN GẮN CHIP &amp; MÃ QR</text>

  <!-- Large Stylized Smart ID Card -->
  <g transform="translate(86, 86)">
    <rect width="414" height="258" rx="12" fill="#FAF8F3" stroke="#D5CFC0" stroke-width="2"/>
    <rect x="0" y="0" width="414" height="46" rx="12" fill="#B91C1C"/>
    <rect x="0" y="28" width="414" height="18" fill="#B91C1C"/>
    <text x="207" y="29" text-anchor="middle" fill="#FEF3C7" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700">CĂN CƯỚC CÔNG DÂN ĐIỆN TỬ</text>

    <!-- Portrait frame -->
    <rect x="26" y="70" width="92" height="118" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
    <circle cx="72" cy="112" r="22" fill="#64748B"/>
    <path d="M40 176 C40 152, 104 152, 104 176" fill="#64748B"/>

    <!-- Gold Embedded EMV Smart Chip -->
    <g transform="translate(142, 74)">
      <rect width="62" height="48" rx="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="48" stroke="#78350F" stroke-width="1.5"/>
      <line x1="42" y1="0" x2="42" y2="48" stroke="#78350F" stroke-width="1.5"/>
      <line x1="0" y1="16" x2="62" y2="16" stroke="#78350F" stroke-width="1.5"/>
      <line x1="0" y1="32" x2="62" y2="32" stroke="#78350F" stroke-width="1.5"/>
      <rect x="22" y="18" width="18" height="12" rx="2" fill="#FEF3C7"/>
    </g>

    <!-- Text placeholder bars -->
    <rect x="142" y="140" width="136" height="10" rx="2" fill="#141A23"/>
    <rect x="142" y="158" width="108" height="8" rx="2" fill="#475569"/>
    <rect x="142" y="174" width="124" height="8" rx="2" fill="#64748B"/>
    <rect x="26" y="210" width="248" height="24" rx="3" fill="#ECE7DB"/>
    <text x="150" y="226" text-anchor="middle" fill="#141A23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">IDVNM024098001234 &lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>

    <!-- Geometric QR Code Matrix top right inside card -->
    <g transform="translate(302, 72)">
      <rect width="88" height="88" rx="3" fill="#FFFFFF" stroke="#141A23" stroke-width="1.5"/>
      <!-- 3 Finder Patterns -->
      <rect x="8" y="8" width="22" height="22" fill="#141A23"/><rect x="12" y="12" width="14" height="14" fill="#FFFFFF"/><rect x="16" y="16" width="6" height="6" fill="#141A23"/>
      <rect x="58" y="8" width="22" height="22" fill="#141A23"/><rect x="62" y="12" width="14" height="14" fill="#FFFFFF"/><rect x="66" y="16" width="6" height="6" fill="#141A23"/>
      <rect x="8" y="58" width="22" height="22" fill="#141A23"/><rect x="12" y="62" width="14" height="14" fill="#FFFFFF"/><rect x="16" y="66" width="6" height="6" fill="#141A23"/>
      <!-- QR Data Modules -->
      <rect x="36" y="10" width="8" height="8" fill="#141A23"/><rect x="46" y="18" width="8" height="8" fill="#141A23"/>
      <rect x="36" y="36" width="14" height="14" fill="#1D4ED8"/><rect x="58" y="38" width="10" height="10" fill="#141A23"/>
      <rect x="12" y="38" width="10" height="10" fill="#141A23"/><rect x="38" y="58" width="12" height="10" fill="#141A23"/>
      <rect x="58" y="58" width="18" height="18" fill="#141A23"/>
    </g>
    <text x="346" y="180" text-anchor="middle" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MÃ QR</text>
  </g>

  <!-- Right Annotations: NFC Reader & Security Benefits -->
  <g transform="translate(534, 92)">
    <rect width="218" height="114" rx="6" fill="#1C2431" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="20" y="30" fill="#FDE68A" font-family="'Be Vietnam Pro', sans-serif" font-size="13.5" font-weight="700">1. Chip RFID / NFC</text>
    <text x="20" y="52" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Lưu vân tay, sinh trắc học</text>
    <text x="20" y="70" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">&amp; mã hóa bảo mật cao</text>
    <text x="20" y="94" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">Đọc không tiếp xúc &lt; 1s</text>
  </g>

  <g transform="translate(534, 224)">
    <rect width="218" height="114" rx="6" fill="#1C2431" stroke="#34D399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#A7F3D0" font-family="'Be Vietnam Pro', sans-serif" font-size="13.5" font-weight="700">2. Quét mã QR nhanh</text>
    <text x="20" y="52" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Giải mã số CMND cũ &amp; tên</text>
    <text x="20" y="70" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">bằng camera điện thoại</text>
    <text x="20" y="94" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11">Thay thế nhiều giấy tờ</text>
  </g>

  <rect x="86" y="366" width="666" height="44" rx="4" fill="#141A23" stroke="#2C384B"/>
  <text x="419" y="393" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="600">Thông tin công dân được số hóa thành dãy bit trong vi mạch → Xác thực chính xác, giảm thủ tục giấy</text>
</svg>
