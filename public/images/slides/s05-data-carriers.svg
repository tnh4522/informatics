<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="carrierBg" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#carrierBg)"/>

  <!-- Title pill -->
  <rect x="195" y="22" width="410" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="42" text-anchor="middle" fill="#FDE68A" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="700">HOẠT ĐỘNG 1 (TR.7) · CÙNG NỘI DUNG BÀI HỌC TRÊN 3 VẬT MANG TIN</text>

  <!-- Central Meaning Banner -->
  <g transform="translate(275, 76)">
    <rect width="250" height="60" rx="6" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
    <text x="125" y="26" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">THÔNG TIN BÀI GIẢNG</text>
    <text x="125" y="45" text-anchor="middle" fill="#BFDBFE" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5">Kiến thức thu được sau khi đọc / xem</text>
  </g>

  <!-- Branches to 3 Carriers -->
  <path d="M400 136 V164 M155 164 H645 M155 164 V192 M400 164 V192 M645 164 V192" stroke="#60A5FA" stroke-width="2.5"/>

  <!-- Card 1: An (Vo ghi chu tay) -->
  <g transform="translate(48, 194)">
    <rect width="214" height="214" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <!-- Paper Notebook Graphic -->
    <rect x="44" y="20" width="126" height="92" rx="4" fill="#FAF8F3" stroke="#D5CFC0" stroke-width="1.5"/>
    <rect x="44" y="20" width="16" height="92" rx="2" fill="#D97706"/>
    <line x1="72" y1="38" x2="156" y2="38" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="54" x2="150" y2="54" stroke="#64748B" stroke-width="2"/>
    <line x1="72" y1="68" x2="142" y2="68" stroke="#64748B" stroke-width="2"/>
    <line x1="72" y1="82" x2="154" y2="82" stroke="#64748B" stroke-width="2"/>
    <line x1="72" y1="96" x2="128" y2="96" stroke="#15803D" stroke-width="2"/>
    <text x="107" y="140" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Bạn An · Vở ghi</text>
    <text x="107" y="162" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12">Chữ viết &amp; hình vẽ tay</text>
    <rect x="37" y="176" width="140" height="24" rx="4" fill="#1E3A8A" opacity="0.7"/>
    <text x="107" y="192" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Vật mang: Giấy</text>
  </g>

  <!-- Card 2: Minh (Anh chup smartphone) -->
  <g transform="translate(293, 194)">
    <rect width="214" height="214" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <!-- Smartphone with photo Graphic -->
    <rect x="65" y="16" width="84" height="100" rx="8" fill="#0F141C" stroke="#60A5FA" stroke-width="2"/>
    <rect x="73" y="28" width="68" height="72" rx="2" fill="#141A23"/>
    <rect x="81" y="36" width="52" height="36" rx="2" fill="#1D4ED8" opacity="0.4" stroke="#93C5FD"/>
    <path d="M84 68 L98 52 L110 64 L120 56 L131 68 Z" fill="#60A5FA"/>
    <circle cx="94" cy="46" r="4" fill="#FBBF24"/>
    <rect x="86" y="80" width="42" height="6" rx="2" fill="#94A3B8"/>
    <text x="107" y="140" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Bạn Minh · Tệp ảnh</text>
    <text x="107" y="162" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12">Ảnh chụp trang vở (JPG)</text>
    <rect x="28" y="176" width="158" height="24" rx="4" fill="#14532D" opacity="0.8"/>
    <text x="107" y="192" text-anchor="middle" fill="#BBF7D0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Vật mang: Bộ nhớ số</text>
  </g>

  <!-- Card 3: Khoa (Tep ghi am / bai giang USB) -->
  <g transform="translate(538, 194)">
    <rect width="214" height="214" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <!-- USB & Audio Wave Graphic -->
    <g transform="translate(50, 22)">
      <rect x="0" y="14" width="66" height="44" rx="4" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
      <rect x="66" y="24" width="24" height="24" rx="2" fill="#CBD5E1"/>
      <rect x="72" y="29" width="8" height="4" fill="#334155"/>
      <rect x="72" y="39" width="8" height="4" fill="#334155"/>
      <!-- Audio waves below -->
      <rect x="4" y="68" width="8" height="22" rx="2" fill="#FBBF24"/>
      <rect x="18" y="62" width="8" height="32" rx="2" fill="#F59E0B"/>
      <rect x="32" y="56" width="8" height="40" rx="2" fill="#FBBF24"/>
      <rect x="46" y="64" width="8" height="28" rx="2" fill="#F59E0B"/>
      <rect x="60" y="60" width="8" height="34" rx="2" fill="#34D399"/>
      <rect x="74" y="66" width="8" height="24" rx="2" fill="#10B981"/>
      <rect x="88" y="70" width="8" height="18" rx="2" fill="#34D399"/>
    </g>
    <text x="107" y="140" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Bạn Khoa · Đa phương tiện</text>
    <text x="107" y="162" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12">Tệp âm thanh &amp; bài giảng</text>
    <rect x="28" y="176" width="158" height="24" rx="4" fill="#78350F" opacity="0.8"/>
    <text x="107" y="192" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Vật mang: USB / Thẻ</text>
  </g>
</svg>
