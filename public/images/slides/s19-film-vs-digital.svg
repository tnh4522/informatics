<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="photoBg" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#photoBg)"/>

  <!-- Header -->
  <rect x="160" y="20" width="480" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="40" text-anchor="middle" fill="#93C5FD" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="700">VẬN DỤNG 2 · TỪ CHỤP ẢNH PHIM SANG CHỤP ẢNH SỐ HIỆN ĐẠI</text>

  <!-- Left: Film Camera Roll (Past) -->
  <g transform="translate(56, 82)">
    <rect width="290" height="296" rx="6" fill="#1C2431" stroke="#D97706" stroke-width="1.5"/>
    <text x="145" y="34" text-anchor="middle" fill="#FDE68A" font-family="'Be Vietnam Pro', sans-serif" font-size="15" font-weight="700">Máy ảnh phim (Analog)</text>
    <!-- Film Roll Canister & Strip -->
    <g transform="translate(46, 56)">
      <rect x="10" y="18" width="52" height="84" rx="4" fill="#B45309" stroke="#FBBF24" stroke-width="2"/>
      <rect x="20" y="6" width="32" height="12" rx="2" fill="#475569"/>
      <rect x="62" y="28" width="132" height="64" rx="2" fill="#0F141C" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Film sprocket holes -->
      <rect x="70" y="34" width="10" height="6" fill="#FAF8F3"/><rect x="88" y="34" width="10" height="6" fill="#FAF8F3"/><rect x="106" y="34" width="10" height="6" fill="#FAF8F3"/><rect x="124" y="34" width="10" height="6" fill="#FAF8F3"/><rect x="142" y="34" width="10" height="6" fill="#FAF8F3"/><rect x="160" y="34" width="10" height="6" fill="#FAF8F3"/>
      <rect x="70" y="80" width="10" height="6" fill="#FAF8F3"/><rect x="88" y="80" width="10" height="6" fill="#FAF8F3"/><rect x="106" y="80" width="10" height="6" fill="#FAF8F3"/><rect x="124" y="80" width="10" height="6" fill="#FAF8F3"/><rect x="142" y="80" width="10" height="6" fill="#FAF8F3"/><rect x="160" y="80" width="10" height="6" fill="#FAF8F3"/>
      <rect x="76" y="45" width="44" height="30" rx="1" fill="#78350F"/><rect x="132" y="45" width="44" height="30" rx="1" fill="#78350F"/>
    </g>
    <text x="145" y="204" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600">• Giới hạn 24–36 kiểu / cuộn</text>
    <text x="145" y="228" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5">• Phải tráng rửa hóa chất mới xem được</text>
    <text x="145" y="252" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5">• Khó sao chép hay chia sẻ tức thì</text>
  </g>

  <!-- Transform Arrow -->
  <g transform="translate(362, 214)">
    <path d="M0 16 H56" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 4 L60 16 L44 28" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Digital Sensor & Smartphone/Cloud -->
  <g transform="translate(436, 82)">
    <rect width="308" height="296" rx="6" fill="#1C2431" stroke="#10B981" stroke-width="2"/>
    <text x="154" y="34" text-anchor="middle" fill="#86EFAC" font-family="'Be Vietnam Pro', sans-serif" font-size="15" font-weight="700">Chụp ảnh số (CMOS · Điểm ảnh)</text>
    <!-- Digital Pixel Matrix + Screen -->
    <g transform="translate(48, 54)">
      <rect width="98" height="98" rx="4" fill="#141A23" stroke="#3B82F6" stroke-width="2"/>
      <!-- 4x4 colored pixel mosaic -->
      <rect x="11" y="11" width="16" height="16" fill="#1D4ED8"/><rect x="31" y="11" width="16" height="16" fill="#3B82F6"/><rect x="51" y="11" width="16" height="16" fill="#60A5FA"/><rect x="71" y="11" width="16" height="16" fill="#93C5FD"/>
      <rect x="11" y="31" width="16" height="16" fill="#15803D"/><rect x="31" y="31" width="16" height="16" fill="#10B981"/><rect x="51" y="31" width="16" height="16" fill="#34D399"/><rect x="71" y="31" width="16" height="16" fill="#FBBF24"/>
      <rect x="11" y="51" width="16" height="16" fill="#0F766E"/><rect x="31" y="51" width="16" height="16" fill="#1D4ED8"/><rect x="51" y="51" width="16" height="16" fill="#10B981"/><rect x="71" y="51" width="16" height="16" fill="#F59E0B"/>
      <rect x="11" y="71" width="16" height="16" fill="#1E293B"/><rect x="31" y="71" width="16" height="16" fill="#334155"/><rect x="51" y="71" width="16" height="16" fill="#1D4ED8"/><rect x="71" y="71" width="16" height="16" fill="#10B981"/>
      <!-- Cloud/Phone -->
      <rect x="122" y="12" width="90" height="74" rx="4" fill="#141A23" stroke="#34D399" stroke-width="1.5"/>
      <path d="M132 76 L154 44 L172 64 L188 50 L202 76 Z" fill="#10B981"/>
      <circle cx="152" cy="30" r="6" fill="#FBBF24"/>
    </g>
    <text x="154" y="204" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600">• Xem &amp; chỉnh sửa tức thì trên màn hình</text>
    <text x="154" y="228" text-anchor="middle" fill="#BBF7D0" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5">• Lưu hàng chục nghìn ảnh trên thẻ 16 GB</text>
    <text x="154" y="252" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5">• Chia sẻ Internet toàn cầu trong vài giây</text>
  </g>
</svg>
