<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="libBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#libBg)"/>

  <!-- Header -->
  <rect x="175" y="20" width="450" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="40" text-anchor="middle" fill="#FDE68A" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700">SỐ HÓA THƯ VIỆN · 2.000 CUỐN SÁCH VÀO Ổ CỨNG SSD 256 GB</text>

  <!-- Left: Stacks of Physical Books -->
  <g transform="translate(56, 98)">
    <rect width="224" height="260" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <!-- Book Stack 1 -->
    <rect x="34" y="138" width="156" height="22" rx="2" fill="#B45309" stroke="#FBBF24"/>
    <rect x="38" y="114" width="148" height="22" rx="2" fill="#1D4ED8" stroke="#60A5FA"/>
    <rect x="32" y="90" width="160" height="22" rx="2" fill="#15803D" stroke="#34D399"/>
    <rect x="42" y="66" width="144" height="22" rx="2" fill="#FAF8F3" stroke="#D5CFC0"/>
    <rect x="48" y="42" width="132" height="22" rx="2" fill="#DC2626" stroke="#FCA5A5"/>
    <text x="112" y="194" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">2.000 cuốn sách giấy</text>
    <text x="112" y="216" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">50 MB / cuốn số hóa</text>
    <text x="112" y="236" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="11">Chiếm nhiều kệ tủ cồng kềnh</text>
  </g>

  <!-- Center: Scanner Bridge -->
  <g transform="translate(304, 152)">
    <rect width="176" height="152" rx="6" fill="#141A23" stroke="#60A5FA" stroke-width="2"/>
    <rect x="24" y="24" width="128" height="44" rx="4" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="34" y1="46" x2="142" y2="46" stroke="#60A5FA" stroke-width="3"/>
    <text x="88" y="92" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700">Số hóa dữ liệu</text>
    <text x="88" y="114" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">2000 × 50 MB</text>
    <text x="88" y="132" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">= 100.000 MB</text>
  </g>
  <path d="M280 228 H302 M480 228 H504" stroke="#60A5FA" stroke-width="3"/>

  <!-- Right: Compact SSD 256 GB Capacity Bar -->
  <g transform="translate(506, 98)">
    <rect width="238" height="260" rx="6" fill="#1C2431" stroke="#10B981" stroke-width="2"/>
    <!-- Sleek SSD Body -->
    <rect x="52" y="28" width="134" height="82" rx="6" fill="#0F141C" stroke="#34D399" stroke-width="2"/>
    <rect x="66" y="42" width="106" height="18" rx="2" fill="#14532D"/>
    <text x="119" y="55" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SSD · 256 GB</text>
    <!-- Storage Usage Bar Inside SSD -->
    <rect x="66" y="72" width="106" height="18" rx="2" fill="#1E293B" stroke="#334155"/>
    <rect x="66" y="72" width="41" height="18" rx="2" fill="#2563EB"/>
    <text x="119" y="136" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Chỉ chiếm ~97,66 GB</text>
    <text x="119" y="160" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">~38,1% dung lượng ổ</text>
    <rect x="24" y="182" width="190" height="54" rx="4" fill="#14532D" opacity="0.65" stroke="#22C55E"/>
    <text x="119" y="204" text-anchor="middle" fill="#DCFCE7" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="700">CHỨA ĐƯỢC TOÀN BỘ</text>
    <text x="119" y="224" text-anchor="middle" fill="#BBF7D0" font-family="'JetBrains Mono', monospace" font-size="11">Còn dư ~158,34 GB trống</text>
  </g>
</svg>
