<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="scaleBg" cx="55%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#scaleBg)"/>

  <!-- Header -->
  <rect x="175" y="20" width="450" height="32" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="40" text-anchor="middle" fill="#93C5FD" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700">BẢNG 1.1 · BỘI SỐ ĐƠN VỊ LƯU TRỮ DỮ LIỆU (2^10 = 1024)</text>

  <!-- Stepped Bar / Cube Escalation -->
  <!-- Bit -->
  <g transform="translate(52, 310)">
    <rect width="92" height="72" rx="4" fill="#1C2431" stroke="#475569" stroke-width="1.5"/>
    <text x="46" y="32" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">bit</text>
    <text x="46" y="54" text-anchor="middle" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">0 hoặc 1</text>
  </g>
  <text x="162" y="344" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">× 8</text>

  <!-- Byte -->
  <g transform="translate(182, 274)">
    <rect width="94" height="108" rx="4" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="47" y="42" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700">Byte</text>
    <text x="47" y="64" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">= 8 bit</text>
    <text x="47" y="88" text-anchor="middle" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">1 kí tự</text>
  </g>
  <text x="294" y="314" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">×1024</text>

  <!-- KB -->
  <g transform="translate(314, 232)">
    <rect width="96" height="150" rx="4" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="48" y="46" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">KB</text>
    <text x="48" y="70" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11">1024 B</text>
    <text x="48" y="96" text-anchor="middle" fill="#DBEAFE" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Trang văn</text>
    <text x="48" y="112" text-anchor="middle" fill="#DBEAFE" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">bản ngắn</text>
  </g>
  <text x="428" y="274" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">×1024</text>

  <!-- MB -->
  <g transform="translate(448, 184)">
    <rect width="98" height="198" rx="4" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
    <text x="49" y="52" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700">MB</text>
    <text x="49" y="76" text-anchor="middle" fill="#DBEAFE" font-family="'JetBrains Mono', monospace" font-size="11">1024 KB</text>
    <text x="49" y="110" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Bài hát MP3</text>
    <text x="49" y="128" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Ảnh sắc nét</text>
  </g>
  <text x="564" y="232" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">×1024</text>

  <!-- GB & TB Stack -->
  <g transform="translate(584, 102)">
    <rect width="164" height="280" rx="6" fill="#141A23" stroke="#10B981" stroke-width="2"/>
    <rect x="16" y="18" width="132" height="102" rx="4" fill="#14532D" stroke="#22C55E"/>
    <text x="82" y="52" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">TB</text>
    <text x="82" y="74" text-anchor="middle" fill="#BBF7D0" font-family="'JetBrains Mono', monospace" font-size="11">1024 GB</text>
    <text x="82" y="96" text-anchor="middle" fill="#DCFCE7" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Kho lưu trữ lớn</text>

    <rect x="16" y="138" width="132" height="122" rx="4" fill="#1E3A8A" stroke="#60A5FA"/>
    <text x="82" y="178" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">GB</text>
    <text x="82" y="200" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="11">1024 MB</text>
    <text x="82" y="226" text-anchor="middle" fill="#DBEAFE" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Thẻ nhớ 16 GB</text>
    <text x="82" y="242" text-anchor="middle" fill="#DBEAFE" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5">Ổ SSD 256 GB</text>
  </g>

  <!-- Bottom Ladder Rule -->
  <rect x="52" y="400" width="696" height="30" rx="4" fill="#1C2431" stroke="#2C384B"/>
  <text x="400" y="419" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Đổi đơn vị Lớn → Nhỏ: NHÂN 1024   |   Đổi Nhỏ → Lớn: CHIA 1024   (PB → EB → ZB → YB tiếp tục × 1024)</text>
</svg>
