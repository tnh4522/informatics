<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="bitBg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#11161E"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bitBg)"/>

  <!-- Single Bit Card Showcase Top -->
  <g transform="translate(80, 32)">
    <rect width="300" height="100" rx="6" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
    <circle cx="48" cy="50" r="24" fill="#141A23" stroke="#60A5FA" stroke-width="2"/>
    <text x="48" y="57" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">0</text>
    <text x="90" y="38" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Bit = Trạng thái TẮT (0)</text>
    <text x="90" y="58" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12">Mức điện áp thấp trong mạch số</text>
    <text x="90" y="76" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Đơn vị nhỏ nhất = 1 bit</text>
  </g>

  <g transform="translate(420, 32)">
    <rect width="300" height="100" rx="6" fill="#1C2431" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="48" cy="50" r="24" fill="#B45309" stroke="#FBBF24" stroke-width="2"/>
    <text x="48" y="57" text-anchor="middle" fill="#FEF3C7" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">1</text>
    <text x="90" y="38" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">Bit = Trạng thái BẬT (1)</text>
    <text x="90" y="58" fill="#CBD5E1" font-family="'Be Vietnam Pro', sans-serif" font-size="12">Mức điện áp cao trong bộ nhớ</text>
    <text x="90" y="76" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11">Hai trạng thái đối lập 0 / 1</text>
  </g>

  <!-- Center Tray: 8-Bit Byte Encoding 'A' (01000001) -->
  <g transform="translate(56, 166)">
    <rect width="688" height="174" rx="8" fill="#141A23" stroke="#3B82F6" stroke-width="2"/>
    <text x="344" y="32" text-anchor="middle" fill="#FAF8F3" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700">1 BYTE = 8 BIT LIÊN TIẾP (Ví dụ mã hóa kí tự 'A' = 65 trong ASCII)</text>

    <!-- 8 Bit Tiles: 0 1 0 0 0 0 0 1 -->
    <!-- Bit 7 (0) -->
    <g transform="translate(32, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^7=128</text>
    </g>
    <!-- Bit 6 (1) -->
    <g transform="translate(110, 54)">
      <rect width="68" height="84" rx="4" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
      <text x="34" y="42" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">1</text>
      <text x="34" y="68" text-anchor="middle" fill="#DBEAFE" font-family="'JetBrains Mono', monospace" font-size="11">2^6=64</text>
    </g>
    <!-- Bit 5 (0) -->
    <g transform="translate(188, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^5=32</text>
    </g>
    <!-- Bit 4 (0) -->
    <g transform="translate(266, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^4=16</text>
    </g>
    <!-- Bit 3 (0) -->
    <g transform="translate(344, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^3=8</text>
    </g>
    <!-- Bit 2 (0) -->
    <g transform="translate(422, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^2=4</text>
    </g>
    <!-- Bit 1 (0) -->
    <g transform="translate(500, 54)">
      <rect width="68" height="84" rx="4" fill="#1C2431" stroke="#334155" stroke-width="1.5"/>
      <text x="34" y="42" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">0</text>
      <text x="34" y="68" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">2^1=2</text>
    </g>
    <!-- Bit 0 (1) -->
    <g transform="translate(578, 54)">
      <rect width="78" height="84" rx="4" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
      <text x="39" y="42" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700">1</text>
      <text x="39" y="68" text-anchor="middle" fill="#DBEAFE" font-family="'JetBrains Mono', monospace" font-size="11">2^0=1</text>
    </g>
  </g>

  <!-- Result Strip Bottom -->
  <rect x="210" y="366" width="380" height="44" rx="4" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="400" y="393" text-anchor="middle" fill="#DCFCE7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">64 + 1 = 65 → Kí tự 'A' (1 Byte = 8 bit)</text>
</svg>
